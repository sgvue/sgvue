# Continuous integration (2026-10-05): type-check, unit tests and build, on the platforms SGVue
# ships for and on Linux. It never starts Electron: the end-to-end suite needs a real GPU and
# runs only under its guard on a developer's machine (CONTRIBUTING.md). Every action is pinned
# to a full commit SHA, with its version in a comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Linux is not a platform SGVue ships for, and this project has never run its tests there:
    # Ubuntu runs to catch portability slips and does not fail the workflow — for now.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The privacy scan (scripts/privacy.cjs): nothing personal — an address, a home path, a
      # private name, a real coordinate — in any tracked file. Every push here is public.
      - run: npm run privacy
      - run: npm run typecheck
      - run: npm run lint
      # The unit tests download Electron's binary on first use (one test imports `electron`).
      - run: npm test
      # The assistant's eval graders, offline (scripts/eval/, tests/unit/ai-eval-offline.test.ts):
      # the oracle must score 100 % and an agent that does nothing 0 %, on every case. No key, no
      # window, no network. It is in `npm test` too; its own step names it when it fails.
      - run: npm run eval:offline
      - run: npm run build
